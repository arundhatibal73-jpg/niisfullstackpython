<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; }                 /* Universal */

  h1 { color: blue; }              /* Element */

  #main { color: orange; }            /* ID */

  .box { background: pink; }     /* Class */

  h2, p { color: green; }          /* Group */
</style>
</head>
<body>

<h1>Heading</h1>
<h2 id="main">Subheading</h2>
<p>Paragraph text</p>
<div class="box">Box 1</div>
<div class="box">Box 2</div>

</body>
</html>
